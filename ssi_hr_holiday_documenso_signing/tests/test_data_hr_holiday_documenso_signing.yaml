scenarios:
  - name: "HR Leave - Documenso Signing Mixin"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Leave Documenso"

      - step: "Get leave type"
        action: "search"
        model: "hr.leave_type"
        domain: []
        save_as: "leave_type"
        limit: 1
        order: "id asc"

      - step: "Create leave request"
        action: "create"
        model: "hr.leave"
        save_as: "leave"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['leave_type'].id"
          date_start: "2024-01-15 08:00:00"
          date_end: "2024-01-15 17:00:00"

      - step: "Assert leave created"
        action: "assert"
        target: "leave"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"

  - name: "HR Leave Allocation - Documenso Signing Mixin"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Alloc Documenso"

      - step: "Get leave type"
        action: "search"
        model: "hr.leave_type"
        domain: []
        save_as: "leave_type"
        limit: 1
        order: "id asc"

      - step: "Create leave allocation"
        action: "create"
        model: "hr.leave_allocation"
        save_as: "allocation"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['leave_type'].id"
          number_of_days: 3
          date_start: 2024-01-01
          date_end: 2024-12-31
          date_extended: 2024-12-31

      - step: "Assert allocation created"
        action: "assert"
        target: "allocation"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
