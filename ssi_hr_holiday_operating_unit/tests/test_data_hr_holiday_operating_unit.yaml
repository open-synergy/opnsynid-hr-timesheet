scenarios:
  - name: "HR Leave - Operating Unit Mixin"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Leave OU"

      - step: "Get leave type"
        action: "search"
        model: "hr.leave_type"
        domain: []
        save_as: "leave_type"
        limit: 1
        order: "id asc"

      - step: "Get operating unit"
        action: "search"
        model: "operating.unit"
        domain: []
        save_as: "operating_unit"
        limit: 1
        order: "id asc"

      - step: "Create leave request with operating unit"
        action: "create"
        model: "hr.leave"
        save_as: "leave"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['leave_type'].id"
          date_start: "2024-01-15 08:00:00"
          date_end: "2024-01-15 17:00:00"
          operating_unit_id: "EVAL: registry['operating_unit'].id"

      - step: "Assert leave created with operating unit"
        action: "assert"
        target: "leave"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          operating_unit_id:
            type: "value"
            operator: "is_truthy"
