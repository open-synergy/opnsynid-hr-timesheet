scenarios:
  - name: "HR Leave Allocation Request Batch - Full Workflow"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Alloc Batch"

      - step: "Get leave type"
        action: "search"
        model: "hr.leave_type"
        domain: []
        save_as: "leave_type"
        limit: 1
        order: "id asc"

      - step: "Create leave allocation batch (draft)"
        action: "create"
        model: "hr.leave_allocation_request_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['leave_type'].id"
          number_of_days: 5
          date_start: 2024-01-01
          date_end: 2024-12-31
          date_extended: 2024-12-31
          employee_ids:
            - "EVAL: registry['employee'].id"

      - step: "Assert batch created in draft"
        action: "assert"
        target: "batch"
        asserts:
          state:
            type: "value"
            expected: "draft"

      - step: "Confirm batch"
        action: "call"
        target: "batch"
        method: "action_confirm"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "confirm"

      - step: "Approve batch"
        action: "call"
        target: "batch"
        method: "action_approve_approval"
        as_user: "base.user_admin"
        context:
          bypass_policy_check: true
        asserts:
          state:
            type: "value"
            expected: "done"
