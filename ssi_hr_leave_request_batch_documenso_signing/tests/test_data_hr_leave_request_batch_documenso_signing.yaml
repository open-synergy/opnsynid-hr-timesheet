scenarios:
  - name: "HR Leave Request Batch - Documenso Signing Mixin"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Leave Batch Documenso"

      - step: "Get leave type"
        action: "search"
        model: "hr.leave_type"
        domain: []
        save_as: "leave_type"
        limit: 1
        order: "id asc"

      - step: "Create leave request batch"
        action: "create"
        model: "hr.leave_request_batch"
        save_as: "batch"
        as_user: "base.user_admin"
        values:
          type_id: "EVAL: registry['leave_type'].id"
          date_start: "2024-01-15 08:00:00"
          date_end: "2024-01-15 17:00:00"
          employee_ids:
            - "EVAL: registry['employee'].id"

      - step: "Assert batch created"
        action: "assert"
        target: "batch"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
