scenarios:
  - name: "HR Overtime - Documenso Signing Mixin"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee OT Documenso"

      - step: "Create overtime type"
        action: "create"
        model: "hr.overtime_type"
        save_as: "overtime_type"
        values:
          name: "Overtime Documenso Type"
          code: "ODT001"
          apply_limit_per_day: false

      - step: "Create overtime"
        action: "create"
        model: "hr.overtime"
        save_as: "overtime"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['overtime_type'].id"
          date: 2024-01-15
          date_start: "2024-01-15 08:00:00"
          date_end: "2024-01-15 10:00:00"

      - step: "Assert overtime created"
        action: "assert"
        target: "overtime"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
