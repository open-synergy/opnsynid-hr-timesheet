scenarios:
  - name: "Attendance Reason - Create"
    steps:
      - step: "Create attendance reason"
        action: "create"
        model: "hr.attendance_reason"
        save_as: "reason"
        values:
          name: "Late Arrival Test"
          code: "LAT001"
          by_system: false

      - step: "Assert attendance reason created"
        action: "assert"
        target: "reason"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          name:
            type: "value"
            expected: "Late Arrival Test"

  - name: "Attendance Reason - Edit"
    steps:
      - step: "Create attendance reason"
        action: "create"
        model: "hr.attendance_reason"
        save_as: "reason"
        values:
          name: "Attendance Reason Edit"
          code: "ARE001"

      - step: "Edit attendance reason"
        action: "write"
        target: "reason"
        values:
          name: "Attendance Reason Edited"

      - step: "Assert edited"
        action: "assert"
        target: "reason"
        asserts:
          name:
            type: "value"
            expected: "Attendance Reason Edited"

  - name: "Attendance Reason - Delete"
    steps:
      - step: "Create attendance reason"
        action: "create"
        model: "hr.attendance_reason"
        save_as: "reason"
        values:
          name: "Attendance Reason Delete"
          code: "ARD001"

      - step: "Delete attendance reason"
        action: "call"
        target: "reason"
        method: "unlink"

      - step: "Verify deleted"
        action: "search"
        model: "hr.attendance_reason"
        domain: [["code", "=", "ARD001"]]
        save_as: "result"
        expect_count: 0

  - name: "HR Timesheet Attendance - Create with open timesheet"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Attendance"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step: "Create timesheet for employee"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2024-01-01
          date_end: 2024-01-31
          working_schedule_id: "EVAL: registry['working_schedule'].id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create attendance"
        action: "create"
        model: "hr.timesheet_attendance"
        save_as: "attendance"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date: 2024-01-15
          check_in: "2024-01-15 08:00:00"
          check_out: "2024-01-15 17:00:00"
          sheet_id: "EVAL: registry['timesheet'].id"

      - step: "Assert attendance created with state present"
        action: "assert"
        target: "attendance"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "present"

      - step: "Assert sheet linked"
        action: "assert"
        target: "attendance"
        asserts:
          sheet_id:
            type: "value"
            operator: "is_truthy"

  - name: "HR Timesheet - Sign Out Without Schedule Does Not Raise"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Sign Out No Schedule"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step:
          "Create timesheet for employee (must span today: the anomaly attendance
          _sign_out() creates is dated today's real date, not the historical attendance
          date below)"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          date_start: "EVAL: (datetime.now() - timedelta(days=30)).date()"
          date_end: "EVAL: (datetime.now() + timedelta(days=5)).date()"
          working_schedule_id: "REC: working_schedule.id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create open attendance without a matching schedule slot"
        action: "create"
        model: "hr.timesheet_attendance"
        save_as: "attendance"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          date: "EVAL: (datetime.now() - timedelta(days=20)).date()"
          check_in:
            "EVAL: (datetime.now() - timedelta(days=20)).replace(hour=8, minute=0,
            second=0, microsecond=0)"
          sheet_id: "REC: timesheet.id"

      - step: "Assert precondition: attendance has no schedule"
        action: "assert"
        target: "attendance"
        asserts:
          schedule_id:
            type: "value"
            operator: "is_falsy"

      - step: "Sign out (cross-day, no schedule to compare against)"
        action: "call"
        target: "timesheet"
        method: "_sign_out"
        as_user: "base.user_admin"

      - step: "Verify an anomaly attendance was created for the employee"
        action: "search"
        model: "hr.timesheet_attendance"
        domain: [["employee_id", "=", "REC: employee.id"]]
        save_as: "all_attendances"
        expect_count: 2

      - step: "Get the newly created anomaly attendance"
        action: "search"
        model: "hr.timesheet_attendance"
        domain: [["employee_id", "=", "REC: employee.id"]]
        save_as: "anomaly_attendance"
        limit: 1
        order: "check_in desc"

      - step: "Assert anomaly attendance is a new, closed record"
        action: "assert"
        target: "anomaly_attendance"
        asserts:
          id:
            type: "value"
            operator: "not_equals"
            expected: "REC: attendance.id"
          check_out:
            type: "value"
            operator: "is_truthy"

      - step: "Assert original attendance was left untouched (still open)"
        action: "assert"
        target: "attendance"
        asserts:
          check_out:
            type: "value"
            operator: "is_falsy"

  - name: "HR Timesheet - Sign Out With Schedule Filled Keeps Buffer Behavior"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Sign Out With Schedule"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step:
          "Create timesheet for employee (must span today: the anomaly attendance
          _sign_out() creates is dated today's real date, not the historical attendance
          date below)"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          date_start: "EVAL: (datetime.now() - timedelta(days=30)).date()"
          date_end: "EVAL: (datetime.now() + timedelta(days=5)).date()"
          working_schedule_id: "REC: working_schedule.id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create a schedule slot dated the same day as the attendance"
        action: "create"
        model: "hr.timesheet_attendance_schedule"
        save_as: "schedule"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          date_start:
            "EVAL: (datetime.now() - timedelta(days=20)).replace(hour=8, minute=0,
            second=0, microsecond=0)"
          date_end:
            "EVAL: (datetime.now() - timedelta(days=20)).replace(hour=17, minute=0,
            second=0, microsecond=0)"

      - step: "Create open attendance matching the schedule slot's date"
        action: "create"
        model: "hr.timesheet_attendance"
        save_as: "attendance"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee.id"
          date: "EVAL: (datetime.now() - timedelta(days=20)).date()"
          check_in:
            "EVAL: (datetime.now() - timedelta(days=20)).replace(hour=8, minute=0,
            second=0, microsecond=0)"
          sheet_id: "REC: timesheet.id"

      - step: "Assert precondition: attendance schedule is resolved"
        action: "assert"
        target: "attendance"
        asserts:
          schedule_id:
            type: "m2o"
            expected: "REC: schedule"

      - step: "Sign out (cross-day, gap far exceeds checkout_buffer)"
        action: "call"
        target: "timesheet"
        method: "_sign_out"
        as_user: "base.user_admin"

      - step: "Verify an anomaly attendance was still created"
        action: "search"
        model: "hr.timesheet_attendance"
        domain: [["employee_id", "=", "REC: employee.id"]]
        save_as: "all_attendances"
        expect_count: 2

      - step: "Get the newly created anomaly attendance"
        action: "search"
        model: "hr.timesheet_attendance"
        domain: [["employee_id", "=", "REC: employee.id"]]
        save_as: "anomaly_attendance"
        limit: 1
        order: "check_in desc"

      - step: "Assert anomaly attendance is a new, closed record"
        action: "assert"
        target: "anomaly_attendance"
        asserts:
          id:
            type: "value"
            operator: "not_equals"
            expected: "REC: attendance.id"
          check_out:
            type: "value"
            operator: "is_truthy"

      - step: "Assert original attendance was left untouched (still open)"
        action: "assert"
        target: "attendance"
        asserts:
          check_out:
            type: "value"
            operator: "is_falsy"

  - name: "HR Timesheet Attendance - Compute Sheet With Empty Date Does Not Raise"
    steps:
      - step: "Open a new attendance form without filling Date"
        action: "form"
        model: "hr.timesheet_attendance"
        save: false
        asserts:
          sheet_id:
            type: "value"
            operator: "is_falsy"

  - name: "HR Timesheet Attendance - Compute Sheet With Date But No Open Sheet Raises"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee_no_sheet"
        values:
          name: "Test Employee No Sheet"

      - step:
          "Fill Date on the form with no open timesheet - raises Sheet Not FOUND on the
          onchange, before any INSERT is attempted"
        action: "form"
        model: "hr.timesheet_attendance"
        as_user: "base.user_admin"
        expect_error:
          type: "UserError"
          message_contains: "Sheet Not FOUND"
        values:
          employee_id: "REC: employee_no_sheet"
          date: 2024-02-01
          check_in: "2024-02-01 08:00:00"

  - name: "HR Timesheet Attendance - Compute Sheet Resolves Matching Sheet"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee_compute_sheet"
        values:
          name: "Test Employee Compute Sheet"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule_compute_sheet"
        limit: 1
        order: "id asc"

      - step: "Create first open timesheet (March)"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet_march"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_compute_sheet.id"
          date_start: 2024-03-01
          date_end: 2024-03-31
          working_schedule_id: "REC: working_schedule_compute_sheet.id"

      - step: "Open March timesheet"
        action: "call"
        target: "timesheet_march"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create second open timesheet (April)"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet_april"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_compute_sheet.id"
          date_start: 2024-04-01
          date_end: 2024-04-30
          working_schedule_id: "REC: working_schedule_compute_sheet.id"

      - step: "Open April timesheet"
        action: "call"
        target: "timesheet_april"
        method: "action_open"
        as_user: "base.user_admin"

      - step:
          "Create attendance dated in March; sheet_id passed explicitly so the initial
          INSERT satisfies the NOT NULL constraint (Odoo only computes stored fields
          AFTER insert, so a required stored compute field can never be left out of
          create() values)"
        action: "create"
        model: "hr.timesheet_attendance"
        save_as: "attendance_compute_sheet"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_compute_sheet.id"
          date: 2024-03-15
          check_in: "2024-03-15 08:00:00"
          sheet_id: "REC: timesheet_march.id"

      - step: "Assert precondition: sheet_id is the March sheet"
        action: "assert"
        target: "attendance_compute_sheet"
        asserts:
          sheet_id:
            type: "m2o"
            expected: "REC: timesheet_march"

      - step:
          "Move the attendance Date into April without touching sheet_id - write() only
          updates the given columns, so the recompute this triggers via
          @api.depends('date') runs safely against the already-existing row"
        action: "write"
        target: "attendance_compute_sheet"
        values:
          date: 2024-04-15

      - step: "Assert sheet_id was recomputed to the April sheet"
        action: "assert"
        target: "attendance_compute_sheet"
        asserts:
          sheet_id:
            type: "m2o"
            expected: "REC: timesheet_april"

  - name: "HR Timesheet Attendance - Compute Sheet Recomputes When Employee Changes"
    steps:
      - step: "Create first employee (has an open sheet for June)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_recompute_a"
        values:
          name: "Test Employee Recompute A"

      - step: "Create second employee (has its own open sheet for June)"
        action: "create"
        model: "hr.employee"
        save_as: "employee_recompute_b"
        values:
          name: "Test Employee Recompute B"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule_recompute"
        limit: 1
        order: "id asc"

      - step: "Create open June timesheet for first employee"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet_recompute_a"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_recompute_a.id"
          date_start: 2024-06-01
          date_end: 2024-06-30
          working_schedule_id: "REC: working_schedule_recompute.id"

      - step: "Open first employee timesheet"
        action: "call"
        target: "timesheet_recompute_a"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Create open June timesheet for second employee"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet_recompute_b"
        as_user: "base.user_admin"
        values:
          employee_id: "REC: employee_recompute_b.id"
          date_start: 2024-06-01
          date_end: 2024-06-30
          working_schedule_id: "REC: working_schedule_recompute.id"

      - step: "Open second employee timesheet"
        action: "call"
        target: "timesheet_recompute_b"
        method: "action_open"
        as_user: "base.user_admin"

      - step:
          "On a new attendance form, set Employee A then Date - sheet resolves to
          employee A's sheet; then switch Employee to B WITHOUT touching Date again -
          sheet must recompute to employee B's own sheet (regression guard for
          @api.depends missing 'employee_id')"
        action: "form"
        model: "hr.timesheet_attendance"
        save_as: "attendance_recompute"
        as_user: "base.user_admin"
        save: true
        ops:
          - set: {employee_id: "REC: employee_recompute_a"}
          - set: {date: 2024-06-15}
          - set: {check_in: "2024-06-15 08:00:00"}
          - assert:
              sheet_id:
                type: "m2o"
                expected: "REC: timesheet_recompute_a"
          - set: {employee_id: "REC: employee_recompute_b"}
          - assert:
              sheet_id:
                type: "m2o"
                expected: "REC: timesheet_recompute_b"

      - step: "Assert sheet stays correctly resolved after save"
        action: "assert"
        target: "attendance_recompute"
        asserts:
          sheet_id:
            type: "m2o"
            expected: "REC: timesheet_recompute_b"
