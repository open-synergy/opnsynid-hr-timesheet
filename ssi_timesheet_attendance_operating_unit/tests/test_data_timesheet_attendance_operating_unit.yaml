scenarios:
  - name: "HR Timesheet Attendance - Operating Unit Mixin"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee Attendance OU"

      - step: "Get working schedule"
        action: "search"
        model: "resource.calendar"
        domain: []
        save_as: "working_schedule"
        limit: 1
        order: "id asc"

      - step: "Create timesheet for employee"
        action: "create"
        model: "hr.timesheet"
        save_as: "timesheet"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date_start: 2024-01-01
          date_end: 2024-01-31
          working_schedule_id: "EVAL: registry['working_schedule'].id"

      - step: "Open timesheet"
        action: "call"
        target: "timesheet"
        method: "action_open"
        as_user: "base.user_admin"

      - step: "Get operating unit"
        action: "search"
        model: "operating.unit"
        domain: []
        save_as: "operating_unit"
        limit: 1
        order: "id asc"

      - step: "Create attendance with operating unit"
        action: "create"
        model: "hr.timesheet_attendance"
        save_as: "attendance"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          date: 2024-01-15
          check_in: "2024-01-15 08:00:00"
          check_out: "2024-01-15 17:00:00"
          operating_unit_id: "EVAL: registry['operating_unit'].id"
          sheet_id: "EVAL: registry['timesheet'].id"

      - step: "Assert attendance created with operating unit"
        action: "assert"
        target: "attendance"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          operating_unit_id:
            type: "value"
            operator: "is_truthy"
