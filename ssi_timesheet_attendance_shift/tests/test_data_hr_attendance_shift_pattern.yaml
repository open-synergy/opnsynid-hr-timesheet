            - - 0
              - 0
              - day_index: 2
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 3
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 4
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 5
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 6
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 7
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 8
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 9
                shift_id: "REC: shift.id"
            - - 0
              - 0
              - day_index: 10
                shift_id: "REC: shift.id"
            - - 0
