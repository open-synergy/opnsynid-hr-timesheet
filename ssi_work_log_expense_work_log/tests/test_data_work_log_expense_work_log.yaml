scenarios:
  - name: "Work Log Expense - Work Log Mixin Integration"
    steps:
      - step: "Create employee"
        action: "create"
        model: "hr.employee"
        save_as: "employee"
        values:
          name: "Test Employee WL Expense Work Log"

      - step: "Search expense account"
        action: "search"
        model: "account.account"
        domain: []
        save_as: "expense_account"
        limit: 1
        order: "id asc"

      - step: "Search journal"
        action: "search"
        model: "account.journal"
        domain: []
        save_as: "journal"
        limit: 1
        order: "id asc"

      - step: "Create expense type"
        action: "create"
        model: "work_log_expense_type"
        save_as: "expense_type"
        values:
          name: "Expense Work Log Type"
          code: "EWLT001"
          accrue_account_id: "EVAL: registry['expense_account'].id"
          journal_id: "EVAL: registry['journal'].id"

      - step: "Create work log expense"
        action: "create"
        model: "work_log_expense"
        save_as: "expense"
        as_user: "base.user_admin"
        values:
          employee_id: "EVAL: registry['employee'].id"
          type_id: "EVAL: registry['expense_type'].id"
          date: 2024-01-15
          date_start: 2024-01-01
          date_end: 2024-01-31
          accrue_account_id: "EVAL: registry['expense_account'].id"
          journal_id: "EVAL: registry['journal'].id"

      - step: "Assert expense created"
        action: "assert"
        target: "expense"
        asserts:
          id:
            type: "value"
            operator: "is_truthy"
          state:
            type: "value"
            expected: "draft"
